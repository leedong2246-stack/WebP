<!DOCTYPE html>
<html>
<head>
<metacharset="utf-8">
<title>시간정보입력응용</title>
</head>
<body>
<h3>생일축하합니다</h3>
<hr>
당신의생일은2003년2월9일입니다. 틀리면수정하시고
파티시간과장소를입력하세요.
<hr>
<form>
<table>
<tr><td>생일</td>
<td><input type="date" value="2003-02-09"></td></tr>
<tr><td>생일파티시간</td>
<td><input type="time"></td></tr>
<tr><td>생일파티장소</td>
<td><input type="text"></td></tr>
</table>
</form>
</body>
</html>
