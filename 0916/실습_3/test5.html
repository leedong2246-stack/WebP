<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도형 서식 폼 만들기 - Chrome</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>도형 서식 폼 만들기</legend>
            <label>선두께 <input type="number" value="1" min="1"></label><br><br>
            <label>선종류 
                <select>
                    <option>선없음</option>
                    <option selected>실선</option>
                    <option>점선</option>
                </select>
            </label><br><br>
            <label>선색 <input type="color" value="#0055ff"></label><br><br>
            <label>투명도(0~100) : <input type="range" min="0" max="100" value="50"></label>
        </fieldset>
    </form>
</body>
</html>
