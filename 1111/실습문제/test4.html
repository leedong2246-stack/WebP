<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>onmousemove</title>
    <style>
        div#cursor {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none; /* 마우스 클릭 방해 금지 */
        }
    </style>
    <script>
        document.onmousemove = function(e) {
            let imgDiv = document.getElementById("cursor");
            imgDiv.style.left = e.clientX + "px";
            imgDiv.style.top = e.clientY + "px";
        }
    </script>
</head>
<body>
    <h3>이미지 커서 만들기</h3>
    <hr>
    <p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다.</p>
    <div id="cursor"><img src="spongebob.png" width="30" height="30"></div>
</body>
</html>
