<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>익명함수로이벤트리스너작성</title>
    <script>
        let p;
        functioninit() { // 문서가완전히로드되었을때호출
            p = document.getElementById("p");
            p.onmouseover = function () { // 익명함수
                this.style.backgroundColor = "orchid";
            };
            p.addEventListener("mouseout",
                function () { this.style.backgroundColor = "white"; } // 익명함수
            );
        }
    </script>
</head>

<body onload="init()">
    <h3>익명함수로이벤트리스너작성</h3>
    <hr>
    <pid="p">마우스올리면orchid 색으로변경</p>
</body>

</html>
