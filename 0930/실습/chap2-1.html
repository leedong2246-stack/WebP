<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>소연재</title>
    <style>
        #fixed-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: plum;
            color: purple;
            font-weight: bold;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h3>소연재</h3>
    <hr>
    <p>저는 체조 선수 소연재입니다. 음악을 들으면서 책읽기를 좋아합니다. 김치 찌개와 막국수 무척 좋아합니다.</p>
    
    <div id="fixed-banner">
        소연재 공연은 24일입니다.
    </div>
</body>
</html>
