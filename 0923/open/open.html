<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>컴퓨터 기술 소개</title>
    <style>
        body {
            background-color: aliceblue;
        }
        h1 {
            color: brown;
            text-align: center;
        }
        header {
            border-bottom: 1px solid brown;
        }
        ul {
            border: 1px dotted green;
            padding: 15px 30px;
        }
        a {
            text-decoration: none;
        }
        p {
            font-family: '휴먼편지체', sans-serif;
            font-size: 1em;
            text-indent: 1em;
        }
        h2 {
            color: blue;
            text-shadow: 2px 2px 4px skyblue;
        }
        footer {
            background-color: orange;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>스마트폰</h1>
        <p>스마트폰은 컴퓨터를 결합한 무선 휴대전화기이다...</p>
        <audio src="sample.mp3" controls></audio>
    </header>

    <h2>목차</h2>
    <ul>
        <li><a href="#history">역사</a></li>
        <li><a href="#android">안드로이드폰</a></li>
        <li><a href="#iphone">아이폰</a></li>
        <li><a href="#sample">샘플</a></li>
    </ul>

    <h2 id="history">역사</h2>
    <p>최초의 스마트폰은 사이먼(Symon)으로 추정된다...</p>

    <h2 id="android">안드로이드</h2>
    <p>안드로이드(영어: Android)는 휴대 전화를 비롯한 휴대용 장치를 위한 운영 체제라...</p>

    <h2 id="iphone">아이폰</h2>
    <p>아이폰(영어: iPhone)은 2007년 1월 9일, 애플이 발표한 휴대 전화 시리즈이다...</p>

    <h2 id="sample">샘플</h2>
    <p>스마트폰 샘플</p>

    </footer>

</html>
