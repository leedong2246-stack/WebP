<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>:hover 활용</title>
    <style>
        div.card {
            width: 150px;
            height: 220px;
            background-image: url('card_back.png'); /* 뒷면 이미지 파일명 */
            background-size: cover;
        }
        div.card:hover {
            background-image: url('card_front.png'); /* 앞면 이미지 파일명 */
        }
    </style>
</head>
<body>
    <h3>:hover 활용</h3>
    <hr>
    <p>마우스를 올리면 카드의 앞면이 보인다.</p>
    <div class="card"></div>
</body>
</html>
