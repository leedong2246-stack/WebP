<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>text-shadow와 box-shadow</title>
    <style>
        h3 {
            color: yellow;
            text-shadow: 3px 3px 5px blue;
            font-size: 28px;
        }
        .item {
            display: inline-block;
            margin: 10px;
        }
        .item img {
            width: 150px;
            height: 100px;
            border: 1px solid gray;
        }
        .item img:hover {
            box-shadow: 5px 5px 10px gray;
        }
    </style>
</head>
<body>
    <h3>Most Visited Pages</h3>
    <hr>
    <div class="item"><img src="naver.png" alt="Naver"></div>
    <div class="item"><img src="chosun.png" alt="Chosun"></div>
    <div class="item"><img src="amazon.png" alt="Amazon"></div>
</body>
</html>
