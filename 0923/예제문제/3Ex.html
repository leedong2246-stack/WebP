<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>&lt;style&gt; 태그로 스타일 만들기</title>
    <style>
        body {
            background-color: linen;
            color: blueviolet;
            margin-left: 30px;
            margin-right: 30px;
        }

        h3 {
            text-align: center;
            color: darkred;
        }
    </style>
</head>

<body>
    <h3>소연재</h3>
    <hr>
    <p>저는 체조선수소연재입니다. 음악을들으면서
        책읽기를좋아합니다. 김치찌개와막국수무척
        좋아합니다.</p>
</body>

</html>
