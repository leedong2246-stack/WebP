<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>document.write() - 표 만들기</title>
</head>
<body>
    <h3>document.write()로 표만들기</h3>
    <hr>
    <script>
        document.write("<table border='1'>");
        document.write("<tr><th>n</th>");
        for (let i = 0; i < 10; i++) {
            document.write("<td>" + i + "</td>");
        }
        document.write("</tr><tr><th>n<sup>2</sup></th>");
        for (let i = 0; i < 10; i++) {
            document.write("<td>" + (i * i) + "</td>");
        }
        document.write("</tr></table>");
    </script>
</body>
</html>
