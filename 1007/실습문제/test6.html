<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>1</title>
    <script>
        function big(a, b) {
            let numA = parseInt(a);
            let numB = parseInt(b);
            if (numA > numB) return numA;
            else return numB;
        }
    </script>
</head>
<body>
    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>
</html>
