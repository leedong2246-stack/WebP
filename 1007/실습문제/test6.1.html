<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2</title>
    <script>
        function pr(str, count) {
            for (let i = 0; i < count; i++) {
                document.write(str);
            }
        }
    </script>
</head>
<body>
    <script>
        pr("%", 5);
    </script>
</body>
</html>
