<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>라면을 끓이는 순서</title>
</head>

<body>
    <h3>라면을 끓이는 순서</h3>
    <hr>
    <!-- (3) ol 클릭 시 전체 배경색 yellowgreen 적용 -->
    <ol type="A" onclick="this.style.backgroundColor='yellowgreen'">
        <li>물을 끓인다.</li>
        <li>라면과 스프를 넣는다.</li>
        <li>파를 썰어 넣는다.</li>
        <li>5분 후 <strong>맛있게</strong> 먹는다.</li>
    </ol>

    <script>
        // (2) 모든 <li> 태그의 글자색을 green으로 지정
        let liList = document.getElementsByTagName("li");
        for (let i = 0; i < liList.length; i++) {
            liList[i].style.color = "green";
        }
    </script>
</body>

</html>
