<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>visibility 프로퍼티</title>
    <script>
        function toggleVisibility() {
            let spanList = document.getElementsByTagName("span");
            for (let i = 0; i < spanList.length; i++) {
                let s = spanList[i];
                if (s.style.visibility === "hidden" || s.style.visibility === "") {
                    s.style.visibility = "visible";
                } else {
                    s.style.visibility = "hidden";
                }
            }
        }
    </script>
</head>

<body>
    <h3>다음 빈 곳에 숨은 단어? <button onclick="toggleVisibility()">show/hide</button></h3>
    <hr>
    <ul>
        <li>I ( <span style="visibility:hidden">love</span> ) you.</li>
        <li>CSS is Cascading ( <span style="visibility:hidden">Style</span> ) Sheet.</li>
        <li>응답하라 ( <span style="visibility:hidden">1988</span> ).</li>
    </ul>
</body>

</html>
