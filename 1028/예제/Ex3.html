<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>innerHTML활용</title>
    <script>
        function change() {
            let p = document.getElementById("firstP");
            p.innerHTML = "나의<imgsrc='puppy.png'> 강아지";
        }
    </script>
</head>

<body>
    <h3>innerHTML활용: 아래글자에클릭하면
        예쁜강아지가보입니다.</h3>
    <hr>
    <p id="firstP" style="color:blue" onclick="change()">
        여기에<span style="color:red">클릭하세요</span>
    </p>
</body>

</html>
