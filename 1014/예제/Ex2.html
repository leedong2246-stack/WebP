<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>[]로배열만들기</title>
</head>

<body>
    <h3>[]로배열만들기</h3>
    <hr>
    <script>
        letplots = [20, 5, 8, 15, 20]; // 원소5개의배열생성
        document.write("varplots = [20, 5, 8, 15, 20]<br>");
        for (let i = 0; i < 5; i++) {
            let size = plots[i]; // plots 배열의i번째원소
            while (size > 0) {
                document.write("*");
                size--;
            }
            document.write(plots[i] + "<br>");
        }
    </script>
</body>

</html>
