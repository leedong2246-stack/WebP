<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>문자열 배열 다루기</title>
</head>
<body>
    <h3>문자열 배열 다루기</h3>
    <hr>
    <script>
        let names = new Array("wonsun", "jaemoonlee", "kitae", "gracehwang");

        // (1) 배열에 들어 있는 각 이름 출력
        document.write("이름 : ");
        for (let i = 0; i < names.length; i++) {
            document.write(names[i] + " ");
        }
        document.write("<br>");

        // (2) 가장 긴 이름 출력
        let longest = names[0];
        for (let i = 1; i < names.length; i++) {
            if (names[i].length > longest.length) {
                longest = names[i];
            }
        }
        document.write("가장 긴 이름 : " + longest + "<br>");

        // (3) 사전에서 가장 먼저 나오는 이름 출력
        let first = names[0];
        for (let i = 1; i < names.length; i++) {
            if (names[i] < first) {
                first = names[i];
            }
        }
        document.write("가장 먼저 나오는 이름 : " + first + "<br>");

        // (4) 증가순(알파벳순) 정렬하여 출력
        names.sort();
        document.write("증가순 이름 : ");
        for (let i = 0; i < names.length; i++) {
            document.write(names[i] + " ");
        }
    </script>
</body>
</html>
