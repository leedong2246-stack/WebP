<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>문자열 분할</title>
</head>
<body>
    <h3>문자열 분할</h3>
    <hr>
    <script>
        let input = prompt("문자열 입력");
        let sub = input.split("&");

        for (let i = 0; i < sub.length; i++) {
            document.write(sub[i] + "<br>");
        }
    </script>
</body>
</html>
