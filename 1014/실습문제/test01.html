<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>난수</title>
</head>
<body>
    <h3>난수 10 개 생성</h3>
    <hr>
    <script>
        let plots = []; // 배열 선언

        // 1~100 사이의 난수 10개 생성 후 저장
        for (let i = 0; i < 10; i++) {
            plots[i] = Math.floor(Math.random() * 100) + 1;
        }

        // 배열 출력
        for (let i = 0; i < 10; i++) {
            document.write(plots[i] + " ");
        }
        document.write("<hr>");

        // 제일 큰 수 찾기
        let big = plots[0];
        for (let i = 1; i < 10; i++) {
            if (plots[i] > big) {
                big = plots[i];
            }
        }
        document.write("제일 큰 수는 " + big);
        document.write("<hr>");

        // 배열 오름차순 정렬
        plots.sort(function(a, b) { return a - b; });

        // 정렬된 배열 출력
        for (let i = 0; i < 10; i++) {
            document.write(plots[i] + " ");
        }
    </script>
</body>
</html>
